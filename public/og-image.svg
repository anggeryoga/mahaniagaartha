<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Maha Niaga Artha">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;800&amp;family=Manrope:wght@400;600&amp;display=swap');
      .h { font-family: 'Sora', 'Segoe UI', system-ui, sans-serif; font-weight: 800; }
      .b { font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; font-weight: 400; }
      .t { font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Latar biru solid, tanpa gradient -->
  <rect width="1200" height="630" fill="#1D4ED8"/>

  <!-- Aksen geometris solid -->
  <circle cx="1080" cy="120" r="210" fill="#2563EB" opacity="0.55"/>
  <circle cx="1120" cy="560" r="150" fill="#1E40AF" opacity="0.6"/>

  <!-- Logo mark -->
  <rect x="80" y="76" width="76" height="76" rx="20" fill="#FFFFFF" opacity="0.14"/>
  <path d="M96 132 L118 92 L140 132 M118 92 L118 76" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="80" y="240" class="t" font-size="26" fill="#BFDBFE" letter-spacing="6">CV MAHA NIAGA ARTHA</text>

  <text x="80" y="340" class="h" font-size="72" fill="#FFFFFF">Paket Usaha Makanan &amp;</text>
  <text x="80" y="424" class="h" font-size="72" fill="#FFFFFF">Minuman <tspan fill="#BFDBFE">Siap Jual</tspan></text>

  <text x="80" y="500" class="b" font-size="30" fill="#DBEAFE">Mulai usaha tanpa ribet. Brand, bahan, dan sistem sudah disiapkan.</text>

  <!-- Baris fakta -->
  <g class="t" font-size="26" fill="#FFFFFF">
    <rect x="80" y="536" width="230" height="52" rx="26" fill="#FFFFFF" opacity="0.14"/>
    <text x="104" y="570">4500+ Mitra Usaha</text>

    <rect x="330" y="536" width="210" height="52" rx="26" fill="#FFFFFF" opacity="0.14"/>
    <text x="354" y="570">9 Brand Siap Pakai</text>

    <rect x="560" y="536" width="266" height="52" rx="26" fill="#FFFFFF" opacity="0.14"/>
    <text x="584" y="570">Jepara, Jawa Tengah</text>
  </g>
</svg>
